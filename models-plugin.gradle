sourceSets {
    models {
        java {
            srcDir "${buildDir}/generated-sources/models"
        }
    }
}

dependencies {
    // Standard JPA dependencies for the generated models
    modelsImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    
    // MapStruct dependencies for generated mappers
    modelsImplementation 'org.mapstruct:mapstruct:1.6.0.Beta1'
    modelsAnnotationProcessor 'org.mapstruct:mapstruct-processor:1.6.0.Beta1'
    
    // Dependencies required by the advanced generator examples
    modelsImplementation 'org.springframework.boot:spring-boot-starter-validation'
    modelsImplementation 'com.fasterxml.jackson.core:jackson-annotations'
    modelsImplementation 'io.swagger.core.v3:swagger-annotations:2.2.21'
}

task generateModels(type: JavaExec) {
    classpath = project(':models-generator').sourceSets.main.runtimeClasspath
    mainClass = 'id.adiputera.demo.cms.generator.Generator'
    
    def outputDir = "${buildDir}/generated-sources/models"
    outputs.dir(outputDir)
    
    // Declare the entire compileClasspath as an input so Gradle caches properly
    inputs.files(configurations.compileClasspath)
    // Also track local resources
    inputs.files(fileTree("src/main/resources").matching { 
        include "**/*-items.yaml"
        include "**/*-dtos.yaml" 
    })
    
    doFirst {
        def discoveredYamls = []
        
        // 1. Scan the resolved classpath (JARs and directories) for YAML files
        configurations.compileClasspath.files.each { file ->
            if (file.name.endsWith('.jar') && file.exists()) {
                // Gradle automatically extracts zipTree files to a cache dir
                zipTree(file).matching { 
                    include "**/*-items.yaml" 
                    include "**/*-dtos.yaml"
                }.each { yamlFile ->
                    discoveredYamls.add(yamlFile.absolutePath)
                }
            } else if (file.isDirectory()) {
                fileTree(file).matching { 
                    include "**/*-items.yaml" 
                    include "**/*-dtos.yaml"
                }.each { yamlFile ->
                    discoveredYamls.add(yamlFile.absolutePath)
                }
            }
        }
        
        // 2. Scan local project resources
        fileTree("src/main/resources").matching { 
            include "**/*-items.yaml" 
            include "**/*-dtos.yaml"
        }.each { yamlFile ->
            discoveredYamls.add(yamlFile.absolutePath)
        }
        
        // Feed all discovered files to the Generator's arguments dynamically
        setArgs([outputDir] + discoveredYamls)
    }
}

compileModelsJava {
    dependsOn generateModels
}

task modelsJar(type: Jar) {
    archiveClassifier = 'models'
    from sourceSets.models.output
    destinationDirectory = file("${buildDir}/generated-models")
}

modelsJar.dependsOn modelsClasses

// The main compileJava task must wait for models.jar to be built
compileJava {
    dependsOn modelsJar
}
