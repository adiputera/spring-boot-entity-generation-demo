plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management'
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

sourceSets {
    models {
        java {
            srcDir "${buildDir}/generated-sources/models"
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    
    // Dependencies required to compile the generated models
    modelsImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    
    // Core depends on the generated models, but only at compile time (preventing transitive pollution)
    compileOnly files("${buildDir}/generated-models/models.jar")
}

task generateModels(type: JavaExec) {
    classpath = project(':models-generator').sourceSets.main.runtimeClasspath
    mainClass = 'id.adiputera.demo.cms.generator.Generator'
    
    def outputDir = "${buildDir}/generated-sources/models"
    def yamlFile = file("src/main/resources/core-items.yaml")
    
    args = [outputDir, yamlFile.absolutePath]
    
    inputs.file(yamlFile)
    outputs.dir(outputDir)
}

compileModelsJava {
    dependsOn generateModels
}

task modelsJar(type: Jar) {
    dependsOn compileModelsJava
    archiveFileName = 'models.jar'
    destinationDirectory = file("${buildDir}/generated-models")
    from sourceSets.models.output
}

compileJava {
    dependsOn modelsJar
    classpath += files(modelsJar.archiveFile)
}
